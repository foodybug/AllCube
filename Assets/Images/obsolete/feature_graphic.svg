<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Arcade Grid Pattern -->
    <pattern id="arcadeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.25"/>
    </pattern>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="1024" height="500" fill="url(#bgBanner)"/>

  <!-- Subtle 2D Arcade Vector Grid Overlay -->
  <rect width="1024" height="500" fill="url(#arcadeGrid)"/>

  <!-- Minimal Arcade Motion Trails (Dynamic 2D lines) -->
  <g opacity="0.35">
    <path d="M 150 250 L 400 250" stroke="url(#cyanGlow)" stroke-width="4" stroke-dasharray="12 6"/>
    <path d="M 120 200 L 370 200" stroke="#6BE89C" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 8"/>
    <path d="M 180 300 L 430 300" stroke="#FDE86B" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 8"/>
    
    <!-- Accent Dots / Particles -->
    <circle cx="850" cy="120" r="6" fill="#38BDF8" opacity="0.4"/>
    <circle cx="920" cy="380" r="8" fill="#6BE89C" opacity="0.3"/>
    <circle cx="150" cy="100" r="5" fill="#FDE86B" opacity="0.4"/>
    <circle cx="200" cy="420" r="4" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- CENTERED MAIN ICON CUBE WITH SIMPLE DYNAMIC ARCADE TRAIL -->
  <!-- Trail shapes -->
  <g transform="translate(512, 250)">
    <!-- Trail 3 -->
    <g transform="translate(-120, 0) scale(0.65)" opacity="0.15">
      <polygon points="0,-100 100,0 0,0" fill="#5AD8FE" transform="translate(0, -4)"/>
      <polygon points="0,-100 -100,0 0,0" fill="#6EE5FF" transform="translate(0, -4)"/>
      <polygon points="100,0 0,100 0,0" fill="#6BE89C" transform="translate(4, 0)"/>
      <polygon points="0,100 -100,0 0,0" fill="#FDE86B" transform="translate(0, 4)"/>
      <polygon points="-100,0 0,-100 0,0" fill="#FFFFFF" transform="translate(-4, 0)"/>
    </g>

    <!-- Trail 2 -->
    <g transform="translate(-60, 0) scale(0.85)" opacity="0.3">
      <polygon points="0,-100 100,0 0,0" fill="#5AD8FE" transform="translate(0, -4)"/>
      <polygon points="0,-100 -100,0 0,0" fill="#6EE5FF" transform="translate(0, -4)"/>
      <polygon points="100,0 0,100 0,0" fill="#6BE89C" transform="translate(4, 0)"/>
      <polygon points="0,100 -100,0 0,0" fill="#FDE86B" transform="translate(0, 4)"/>
      <polygon points="-100,0 0,-100 0,0" fill="#FFFFFF" transform="translate(-4, 0)"/>
    </g>

    <!-- Main Front Icon Cube -->
    <g transform="translate(20, 0) scale(1.3)">
      <!-- Top (Blue) -->
      <polygon points="0,-100 100,0 0,0" fill="#5AD8FE" transform="translate(0, -5)"/>
      <polygon points="0,-100 -100,0 0,0" fill="#6EE5FF" transform="translate(0, -5)"/>
      
      <!-- Right (Green) -->
      <polygon points="100,0 0,100 0,0" fill="#6BE89C" transform="translate(5, 0)"/>
      
      <!-- Bottom (Yellow) -->
      <polygon points="0,100 -100,0 0,0" fill="#FDE86B" transform="translate(0, 5)"/>
      
      <!-- Left (White) -->
      <polygon points="-100,0 0,-100 0,0" fill="#FFFFFF" transform="translate(-5, 0)"/>
    </g>
  </g>
</svg>
